<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Panel - KadoDigital</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background: #fdfaf6; color: #594a4e; margin: 0; padding: 20px; }
    .container { max-width: 900px; margin: 0 auto; background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
    
    /* Login Section */
    #loginSection { text-align: center; margin-top: 100px; }
    .input-admin { padding: 12px; margin: 10px 0; width: 100%; max-width: 300px; border-radius: 10px; border: 1px solid #ddd; }
    .btn-login { padding: 12px 30px; background: #ffb5a7; color: white; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; transition: 0.3s; }
    .btn-login:disabled { background: #ccc; cursor: not-allowed; }
    
    /* Dashboard Section */
    #dashboardSection { display: none; }
    .dashboard-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .btn-logout { background: #ff4757; color: white; border: none; padding: 8px 15px; border-radius: 8px; cursor: pointer; font-weight: bold; }
    
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th, td { padding: 15px; text-align: left; border-bottom: 1px solid #eee; }
    th { background: #f8edeb; }
    .badge-pending { background: #ffd166; padding: 5px 10px; border-radius: 20px; font-size: 12px; font-weight: bold; }
    .badge-active { background: #06d6a0; color: white; padding: 5px 10px; border-radius: 20px; font-size: 12px; font-weight: bold; }
    .btn-acc { background: #06d6a0; color: white; border: none; padding: 8px 15px; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.3s; }
    .btn-acc:hover { background: #05b586; }
  </style>
</head>
<body>

  <!-- BAGIAN LOGIN ADMIN -->
  <div id="loginSection">
    <h2>🔒 Login Admin KadoDigital</h2>
    <form id="adminLoginForm">
      <input type="email" id="adminEmail" class="input-admin" placeholder="Email Admin" required><br>
      <input type="password" id="adminPass" class="input-admin" placeholder="Password" required><br>
      <button type="submit" id="btnLogin" class="btn-login">Masuk Dashboard</button>
    </form>
    <p id="loginError" style="color: red; display: none; font-size: 14px; margin-top: 10px;"></p>
  </div>

  <!-- BAGIAN DASHBOARD (Disembunyikan sebelum login) -->
  <div id="dashboardSection" class="container">
    <div class="dashboard-header">
      <h2>👋 Halo Bos! Ini Daftar Pesananmu</h2>
      <button onclick="logoutAdmin()" class="btn-logout">Keluar (Logout)</button>
    </div>
    <button onclick="fetchPesanan()" style="margin-bottom: 15px; cursor: pointer; padding: 8px 15px; border-radius: 8px; border: 1px solid #ddd; background: white;">🔄 Refresh Data</button>
    
    <table>
      <thead>
        <tr>
          <th>ID Kado</th>
          <th>Pengirim & Penerima</th>
          <th>Template</th>
          <th>Status</th>
          <th>Aksi</th>
        </tr>
      </thead>
      <tbody id="tabelPesanan">
        <!-- Data akan dimunculkan di sini -->
      </tbody>
    </table>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/admin.js"></script>
</body>
</html>
